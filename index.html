<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Monitor de Temperatura DS18B20</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f7f7f7;
    }
    h1 {
      margin-bottom: 10px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 700px;
      margin-top: 20px;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }
    th {
      background: #eaeaea;
    }
    #chart-container {
      width: 100%;
      max-width: 800px;
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <h1>Monitor de Temperatura DS18B20</h1>
  <p>Dades actualitzades automàticament cada 30 segons.</p>

  <!-- GRÀFIC -->
  <div id="chart-container">
    <canvas id="tempChart"></canvas>
  </div>

  <!-- TAULA -->
  <table id="temp-table">
    <thead>
      <tr>
        <th>Timestamp (UTC)</th>
        <th>Temperatura (°C)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const JSON_URL = "https://sergipato5.github.io/sergipato5.github.io/data/temperatures.json";

    let chart;
    let chartData = {
      labels: [],
      datasets: [{
        label: "Temperatura (°C)",
        data: [],
        borderColor: "red",
        backgroundColor: "rgba(255,0,0,0.2)",
        tension: 0.2
      }]
    };

    function createChart() {
      const ctx = document.getElementById("tempChart").getContext("2d");
      chart = new Chart(ctx, {
        type: "line",
        data: chartData,
        options: {
          responsive: true,
          scales: {
            x: { title: { display: true, text: "Temps" }},
            y: { title: { display: true, text: "Temperatura (°C)" }}
          }
        }
      });
    }

    async function loadData() {
      try {
        const res = await fetch(JSON_URL + "?t=" + Date.now());
        const data = await res.json();

        // Ordenar per timestamp ascendent
        data.sort((a, b) => (a.timestamp > b.timestamp ? 1 : -1));

        // Actualitzar taula
        const tbody = document.querySelector("#temp-table tbody");
        tbody.innerHTML = "";
        data.forEach(item => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${item.timestamp}</td>
            <td>${item.temperature_c.toFixed(2)}</td>
          `;
          tbody.appendChild(tr);
        });

        // Actualitzar gràfic
        chartData.labels = data.map(d => d.timestamp);
        chartData.datasets[0].data = data.map(d => d.temperature_c);

        chart.update();

      } catch (err) {
        console.error("Error carregant JSON:", err);
      }
    }

    // Inicialitzar
    createChart();
    loadData();
    setInterval(loadData, 30000);
  </script>

</body>
</html>
